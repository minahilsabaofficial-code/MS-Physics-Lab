<style>

*,*:before,*:after{box-sizing:inherit}
body{margin:0;background-color:var(--bg);color:var(--tx);font:16px/1.55 system-ui,sans-serif}

main{max-width:560px;margin:0 auto;padding:14px}
h1,h2{font-family:'Space Grotesk',system-ui,sans-serif;margin:0 0 8px}
body.ur h1,body.ur h2{font-family:'Noto Nastaliq Urdu',serif}
h1{font-size:1.5rem;line-height:1.2;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7)}h2{font-size:1.1rem;color:var(--ac)}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--ac);color:#fff;font-weight:700;min-height:48px}
button.alt{background:transparent;color:var(--ac);border:1.5px solid var(--ac);min-height:40px;padding:6px 12px}
button.go{background:var(--ac2);width:100%;font-size:1.05rem}

.xp{height:12px;background:var(--bd);border-radius:8px;overflow:hidden;margin:6px 0}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s}
.sm{font-size:.9rem;color:var(--mut)}
svg{width:100%;height:auto;display:block;background:var(--bg);border-radius:10px}
input[type=range]{width:100%;height:36px;accent-color:var(--ac2)}
.big{font-size:1.4rem;font-weight:700;color:var(--ac2)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:center}
th,td{padding:8px;border-bottom:1px solid var(--bd)}th{color:var(--ac)}
.cv{position:relative;height:260px}.cv canvas{filter:drop-shadow(0 0 6px var(--ac2))}[hidden]{display:none!important}.fb{font-size:.9rem;margin:4px 0 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}details{margin:10px 0}summary{cursor:pointer;color:var(--ac);font-weight:700}#lab{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#1b2d52}#lab svg{width:100%;height:100%;border-radius:0;background:none;filter:blur(5px) brightness(.6);transform:scale(1.1)}#lab:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 25%,rgba(5,10,25,.8) 100%)}.ex{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:start;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);margin:8px 0;padding:14px;font-size:1.05rem}.ex small{color:var(--ac2)}.ex:disabled{opacity:.65;cursor:default}.ex:disabled small{color:var(--mut)}.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--bg);border:1.5px solid var(--bd)}#sw{font-family:'Space Grotesk',monospace;font-variant-numeric:tabular-nums}#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--ac2);color:#10213f;font-weight:700;padding:12px 18px;border-radius:30px;opacity:0;transition:.35s;pointer-events:none;z-index:5}#toast.on{opacity:1;transform:translate(-50%,0)}
.q{margin:12px 0}.q label{display:block;padding:10px 12px;margin:6px 0;border:1.5px solid var(--bd);border-radius:10px;cursor:pointer}
.q input{margin-inline-end:8px}
.msg{font-weight:700;margin:8px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}
#conf{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#conf span{position:absolute;top:-30px;font-size:26px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#conf{display:none}}
</style>
</head>
